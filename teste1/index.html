<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>testedejs1</title>
</head>
<body>
    <div class="calc-semestre">
  <h3>Projeção de Formatura</h3>
  <div class="campo">
    <label>Ano de Ingresso:</label>
    <input type="number" id="ano-inicio" placeholder="Ex: 2026">
  </div>
  <div class="campo">
    <label>Quantidade de Períodos do Curso:</label>
    <input type="number" id="qtd-periodos" placeholder="Ex: 8">
  </div>
  <button class="btn-projetar" id="btn-calcular-formatura">Calcular Formatura</button>
  <div class="resultado-semestre" id="display-formatura">Ano/Semestre de Conclusão: --</div>
</div>

<style>
  .calc-semestre { width: 320px; background: #e8f4f8; padding: 20px; border-radius: 8px; font-family: sans-serif; border: 1px solid #bce0ee; }
  .calc-semestre h3 { margin-top: 0; color: #0277bd; }
  .campo { margin-bottom: 15px; display: flex; flex-direction: column; }
  .campo label { margin-bottom: 5px; font-size: 14px; color: #333; }
  .campo input { padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
  .btn-projetar { width: 100%; padding: 10px; background: #0288d1; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; margin-bottom: 15px; }
  .btn-projetar:hover { background: #0277bd; }
  .resultado-semestre { padding: 15px; background: white; border: 1px dashed #0288d1; text-align: center; font-weight: bold; color: #333; }
</style>
</body>
</html>
